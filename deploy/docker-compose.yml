# Dockmaster server — run it on a NAS or any docker host:
#   docker compose -f deploy/docker-compose.yml up -d
# Images are built by GitHub Actions (ghcr.io/anton4ik/dockmaster-server, ghcr.io/anton4ik/dockmaster-agent).
# Local build instead:
#   docker build -f src/Dockmaster.Server/Dockerfile -t dockmaster-server:latest . && DOCKMASTER_IMAGE=dockmaster-server:latest docker compose -f deploy/docker-compose.yml up -d
# UI:     http://<host>:8080   (put a reverse proxy with TLS in front; websockets must be allowed)
# Agents: https://<host>:9443  (gRPC over TLS, self-signed cert pinned by fingerprint — no proxy in front of this port)
services:
  dockmaster:
    image: ${DOCKMASTER_IMAGE:-ghcr.io/anton4ik/dockmaster-server:latest}
    container_name: dockmaster
    restart: always
    ports:
      - "${DOCKMASTER_UI_PORT:-8080}:8080"
      - "${DOCKMASTER_AGENT_PORT:-9443}:9443"
    environment:
      # First-run admin password (only used when no password is set yet). Or leave empty and set it on the login page.
      DOCKMASTER_ADMINPASSWORD: "${DOCKMASTER_ADMINPASSWORD:-}"
    volumes:
      - dockmaster_data:/data
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  dockmaster_data:
